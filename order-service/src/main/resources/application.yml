server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:sqlite:./order-service.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 10000
      connection-init-sql: PRAGMA busy_timeout=10000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 2000          # 브로커 없을 때 메타데이터 패치 대기 상한 (기본 60s → 2s)
        request.timeout.ms: 1500   # 브로커 응답 대기 상한
        delivery.timeout.ms: 2000  # 전체 전달 타임아웃 (≥ request.timeout.ms)
    listener:
      # 로컬 전체 기동 시 외부 Kafka 가 없다면 `false` 로 두고, 테스트에서만 Embedded Kafka 로 검증하는 것도 한 방법입니다.
      auto-startup: true

  # Feign 타임아웃 — timelimiter(2s)보다 짧게 설정해 CB가 먼저 감지하도록 함
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 500
            readTimeout: 1500

# Inventory 서비스 Feign 클라이언트 베이스 URL
inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8082}

# Resilience4j 설정
resilience4j:
  circuitbreaker:
    instances:
      inventoryReserve:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict

      inventoryRelease:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - feign.FeignException$NotFound

  retry:
    instances:
      inventoryRelease:
        max-attempts: 2
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException

# Kafka 토픽 — 지원자가 정한 네이밍 규칙으로 조정
catius:
  kafka:
    topics:
      order-confirmed: order-service.order.confirm

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework.kafka: INFO
    io.github.resilience4j: INFO
